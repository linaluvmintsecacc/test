<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janelvy's Sweet16 Adventure - Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">
    <style>
        /* --- GAYA GLOBAL & FULLSCREEN (MAP PENUH SKRIN) --- */
        html, body {
            margin: 0; 
            padding: 0; 
            font-family: 'Caveat', cursive;
            background-color: black;
            height: 100vh; /* 100% tinggi viewport */
            width: 100vw;  /* 100% lebar viewport */
            overflow: hidden; 
            color: white; 
            display: block;
        }
        
        #game-container {
            width: 100%;
            height: 100%;
            position: relative; 
            box-sizing: border-box;
            background-color: black;
        }

        /* SKRIN PENGENALAN */
        #intro-message {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95); color: white;
            display: none; 
            flex-direction: column; justify-content: center;
            align-items: center; z-index: 1000; opacity: 1;
            transition: opacity 3s ease-in-out; font-size: 2.5rem; text-align: center;
        }

        /* --- PAPARAN SCENE (MAP) - FULLSCREEN --- */
        #scene-area {
            position: relative;
            width: 100%;
            height: 100%; 
            background-size: cover; /* Penting: Memastikan imej meliputi keseluruhan skrin */
            background-repeat: no-repeat;
            background-position: center bottom; /* Fokuskan imej dari bawah (lantai) */
            overflow: hidden;
            padding-bottom: 120px; /* Ruang untuk dialog */
            box-sizing: border-box;
        }
        
        /* Kotak Dialog di bawah Map */
        #dialogue-zone {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 120px;
            padding: 10px; box-sizing: border-box; background: rgba(255, 255, 255, 0.95);
            border-top: 2px solid #ff69b4; color: #d1005c; display: flex;
            flex-direction: column; justify-content: space-between;
        }

         #character {
            position: absolute; 
            z-index: 5; 
            width: 8%;  /* Ditingkatkan kepada % saiz skrin */
            height: 25%; /* Ditingkatkan kepada % saiz skrin */
            bottom: 120px; /* Disesuaikan: Berdiri tepat di atas kotak dialog */
            left: 45%; 
            background-size: contain; 
            background-repeat: no-repeat; 
            transition: left 0.1s linear; 
            transform: translateX(-50%); 
        }
        
        /* Posisi Objek Interaktif (Dibiarkan sama) */
        .interactive-object { position: absolute; cursor: pointer; }
        #alarm-clock { top: 60%; left: 8%; width: 100px; height: 100px; } 
        #calendar { top: 30%; left: 70%; width: 80px; height: 80px; }
        #door-exit { top: 15%; left: 75%; width: 200px; height: 85%; }
        #mother { top: 50%; left: 35%; width: 350px; height: 100px; } 
        #door-exit-living { top: 15%; left: 90%; width: 100px; height: 85%; }
        
        /* ... (Gaya Quest Log dan Joystick - Dibiarkan sama) ... */
        #quest-log { position: absolute; top: 10px; left: 10px; z-index: 50; font-size: 1.2em; font-weight: bold; color: #ff69b4; background: rgba(0, 0, 0, 0.5); padding: 5px 10px; border-radius: 5px; }
        #mobile-controls { position: fixed; bottom: 20px; left: 20px; display: none; z-index: 10; }
        .control-button { width: 50px; height: 50px; background-color: rgba(255, 105, 180, 0.7); color: white; border: 2px solid #d1005c; border-radius: 8px; font-size: 1.5em; text-align: center; line-height: 46px; margin: 2px; cursor: pointer; user-select: none; }
        .row { display: flex; }
        .row:nth-child(2) { justify-content: space-around; } 
        .spacer { width: 54px; height: 50px; margin: 2px; }
    </style>
</head>
<body>
    <div id="intro-message">
        <p>Janelvy, aku buat game ni seikhlas yang mungkin. And aku buat game ni time aku free so buat game its not a waste of time. Skill coding aku masih buruk so, sorry kalau buruk. Hope you like it ❤</p>
        <button id="next-intro-btn">Next</button>
    </div>

    <div id="game-container" style="display: none;">
        <div id="quest-log">
            <span id="current-quest-text">Misi Semasa: Dapatkan Kucing</span>
        </div>

        <div id="scene-area"> 
            <div id="character"></div>
            
            <div class="interactive-object" id="alarm-clock" style="display: none;"></div>
            <div class="interactive-object" id="calendar" style="display: none;"></div>
            <div class="interactive-object" id="door-exit" style="display: none;"></div>
            <div class="interactive-object" id="mother" style="display: none;"></div>
            <div class="interactive-object" id="door-exit-living" style="display: none;"></div>
            
            <div id="dialogue-zone">
                <p id="story-text">Memuatkan Scene...</p>
                <p><span id="char-dialogue"></span></p>
                <div id="action-buttons"></div>
            </div>
        </div>
    </div>
    
    <div id="mobile-controls">
        <div class="row">
            <div class="spacer"></div>
            <div class="control-button" data-key="w">⬆</div>
            <div class="spacer"></div>
        </div>
        <div class="row">
            <div class="control-button" data-key="a">⬅</div>
            <div class="control-button" data-key="s">⬇</div>
            <div class="control-button" data-key="d">➡</div>
        </div>
    </div>

    <script>
        // --- KONSTAN LALUAN IMEJ (DISAHKAN DENGAN FAIL ANDA) ---
        const IDLE_IMAGE = 'assets/janelvy_idle.png';
        const walkFrames = [
            'assets/janelvy_walk_2.png', 
            'assets/janelvy_walk_3.png', 
            'assets/janelvy_walk_4.png', 
            IDLE_IMAGE 
        ];

        // --- DATA SCENE (LALUAN IMEJ MAP DISAHKAN) ---
        const GAME_SCENES = {
            'alarm_start': {
                story: "Bunyi alarm berdering di bilik Janelvy. (Bergerak ke Jam: A/D. Interaksi: W)",
                dialogue: null,
                quest: "Turn off alarm.",
                sceneImage: 'assets/janelvy_bedroom_map.png', 
                initialCharPos: 45, 
                activeObjects: ['alarm-clock'], 
                actions: []
            },
            // ... (Scene lain menggunakan map yang sama) ...
            'alarm_off': {
                story: "Janelvy baru bangun dan mematikan alarm.",
                dialogue: "menguap... Harini tarikh berapa ek?",
                quest: "Check calendar. (Bergerak ke Kalendar: A/D. Interaksi: W)",
                sceneImage: 'assets/janelvy_bedroom_map.png',
                activeObjects: ['calendar', 'door-exit'],
                actions: []
            },
            'calendar_check': {
                story: "Janelvy melihat kalendar di dinding.",
                dialogue: "Oh, 4 January ek? WAIT, 4 JANUARY? TODAY'S MY BIRTHDAY!!",
                quest: "Pergi ke ruang tamu untuk berjumpa ibu.",
                sceneImage: 'assets/janelvy_bedroom_map.png',
                activeObjects: ['door-exit'],
                actions: [
                    { text: "Teruskan", nextScene: 'head_to_living_room' }
                ]
            },
            'head_to_living_room': {
                story: "Janelvy menuju ke Ruang Tamu. (Bergerak ke Ibu: A/D. Interaksi: W)",
                dialogue: null,
                quest: "Jumpa Mak di Ruang Tamu.",
                sceneImage: 'assets/ChatGPT Image Nov 16, 2025, 06_26_59 PM.jpg', // Map Ruang Tamu
                initialCharPos: 15, 
                activeObjects: ['mother'], 
                actions: []
            },
            // ... (Kekalkan semua scene lain, pastikan ia merujuk map yang betul) ...
            'mother_reply_sad': {
                story: "Ibunya menjawab, Janelvy berasa agak sedih tetapi masih tersenyum.",
                dialogue: "Harini ek? Rasanya takde, kenapa pi? Nak apa-apa ke?",
                quest: "Balik ke bilik. (Bergerak ke Pintu: A/D. Interaksi: W)",
                sceneImage: 'assets/ChatGPT Image Nov 16, 2025, 06_26_59 PM.jpg',
                activeObjects: ['door-exit-living'],
                actions: []
            },
            'return_to_room_sad': {
                story: "Janelvy balik ke biliknya, sedih. Dia menghela nafas panjang.",
                dialogue: "Kau tak boleh sedih Jane! You're strong! Let's do something untuk tenangkan diri. Hmmm maybe take a walk?",
                quest: "Minta izin keluar rumah (Bergerak ke Pintu: A/D. Interaksi: W).",
                sceneImage: 'assets/Gemini_Generated_Image_fxn30sfxn30sfxn3.jpg',
                initialCharPos: 45,
                activeObjects: ['door-exit'], 
                actions: []
            },
            // ...
            'quest_1_start': {
                story: "Janelvy melangkah keluar rumah. Misi mencari kucing bermula!",
                dialogue: "Mana pula si kenit ni sorok? Kena periksa setiap sudut kejiranan.",
                quest: "Cari Kucing di Luar Rumah.",
                sceneImage: 'assets/outside_map.png', // LALUAN INI PERLU DISAHKAN/DITUKAR JIKA ANDA ADA IMEJ LUAR RUMAH YANG LAIN
                actions: [{ text: "TAMAT DEMO. Sila sambung kod...", nextScene: 'alarm_start' }]
            }
        };

        // --- PEMBOLEH UBAH GLOBAL & FUNGSI UTAMA ---
        const characterEl = document.getElementById('character');
        const sceneAreaEl = document.getElementById('scene-area');
        // ... (Elemen lain) ...
        const introMessageEl = document.getElementById('intro-message');
        const gameContainerEl = document.getElementById('game-container');
        let charPositionX = 45; 
        const MOVE_SPEED = 2; 
        let animationInterval = null;
        
        // FUNGSI ANIMASI & IDLE (Menggunakan IDLE_IMAGE)
        function startWalkAnimation() {
            if (animationInterval) return;
            animationInterval = setInterval(() => {
                currentFrame = (currentFrame + 1) % walkFrames.length;
                characterEl.style.backgroundImage = `url('${walkFrames[currentFrame]}')`;
            }, 100);
        }

        function stopWalkAnimation(isFlipped = false) {
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
                // Tetapkan kepada imej idle
                characterEl.style.backgroundImage = `url('${IDLE_IMAGE}')`; 
            }
            // Kekalkan flip yang betul apabila berhenti
            if (isFlipped) {
                 characterEl.style.transform = 'scaleX(-1) translateX(50%)'; 
            } else {
                 characterEl.style.transform = 'scaleX(1) translateX(-50%)'; 
            }
        }
        
        // FUNGSI PERGERAKAN (Fix Moonwalk/Flip)
        function handleMovement(key) {
            let moved = false;
            let isMovingLeft = false;
            if (key === 'a' || key === 'arrowleft') { charPositionX -= MOVE_SPEED; isMovingLeft = true; moved = true; } 
            else if (key === 'd' || key === 'arrowright') { charPositionX += MOVE_SPEED; isMovingLeft = false; moved = true; } 
            charPositionX = Math.max(0, Math.min(100, charPositionX));
            if (moved) {
                characterEl.style.left = charPositionX + '%';
                // Jika bergerak ke kiri, flip karakter (-1)
                // Jika bergerak ke kanan, un-flip karakter (1)
                characterEl.style.transform = isMovingLeft ? 'scaleX(-1) translateX(50%)' : 'scaleX(1) translateX(-50%)';
                startWalkAnimation();
            }
            if (key === 'w' || key === 'arrowup') { checkInteraction(); }
        }

        // FUNGSI UPDATE SCENE (Memastikan aset dimuatkan)
        function updateScene(sceneKey) {
            const scene = GAME_SCENES[sceneKey];
            if (!scene) { console.error('Scene tidak dijumpai:', sceneKey); return; }

            // ... (Kekalkan logic alarm & initialCharPos) ...
             if (scene.initialCharPos !== undefined) {
                charPositionX = scene.initialCharPos;
                characterEl.style.left = charPositionX + '%';
                characterEl.style.transform = 'scaleX(1) translateX(-50%)'; 
            }
            
            // PENTING: Set Imej Idle Awal (Memastikan karakter keluar)
            characterEl.style.backgroundImage = `url('${IDLE_IMAGE}')`;

            currentSceneKey = sceneKey;

            // PENTING: Set Imej Peta (Memastikan peta keluar)
            sceneAreaEl.style.backgroundImage = `url('${scene.sceneImage}')`;

            // ... (Kekalkan logic dialog, quest, dan action buttons) ...
            const storyTextEl = document.getElementById('story-text');
            const charDialogueEl = document.getElementById('char-dialogue');
            const questTextEl = document.getElementById('current-quest-text');
            const actionButtonsEl = document.getElementById('action-buttons');
            
            storyTextEl.textContent = scene.story;
            charDialogueEl.textContent = scene.dialogue || ""; 
            questTextEl.textContent = `Misi Semasa: ${scene.quest}`;
            
            actionButtonsEl.innerHTML = '';
            if (scene.actions.length > 0) {
                scene.actions.forEach(action => {
                    const button = document.createElement('button');
                    button.textContent = action.text;
                    button.onclick = () => { updateScene(action.nextScene); };
                    actionButtonsEl.appendChild(button);
                });
                actionButtonsEl.style.display = 'block';
            } else {
                actionButtonsEl.style.display = 'none';
            }
            
            updateInteractiveObjects(scene.activeObjects);
        }
        
        // ... (Kekalkan fungsi utility: checkInteraction, playAlarmSound, stopAlarmSound, goFullscreen) ...
        
        let lastInteractionTime = 0;
        const COOLDOWN = 1000;
        
        function checkInteraction() {
            const activeObjects = document.querySelectorAll('.interactive-object[style*="block"]');
            if (activeObjects.length === 0) return;
            let interacted = false;
            const currentTime = Date.now();
            activeObjects.forEach(obj => {
                const targetPosLeft = parseInt(obj.style.left); 
                if (Math.abs(charPositionX - targetPosLeft) < 25) { // INTERACTION_RANGE
                    if (currentTime - lastInteractionTime > COOLDOWN) { 
                        obj.click(); 
                        const isFlippedOnStop = characterEl.style.transform.includes('-1');
                        stopWalkAnimation(isFlippedOnStop); 
                        interacted = true; 
                        lastInteractionTime = currentTime; 
                    }
                    return; 
                }
            });
            if (!interacted && (currentTime - lastInteractionTime > COOLDOWN)) {
                document.getElementById('char-dialogue').textContent = "Saya perlu pergi lebih dekat untuk berinteraksi dengan itu.";
                lastInteractionTime = currentTime;
            }
        }
        let alarmAudio = null; 
        function playAlarmSound() {
            alarmAudio = new Audio('assets/alarm.mp3'); 
            alarmAudio.loop = true;
            alarmAudio.volume = 0.8; 
            alarmAudio.play().catch(e => console.warn("Gagal mainkan audio secara automatik:", e));
        }
        function stopAlarmSound() {
            if (alarmAudio) { alarmAudio.pause(); alarmAudio.currentTime = 0; }
        }
        function goFullscreen(element) {
             if (element.requestFullscreen) { element.requestFullscreen(); } 
             else if (element.webkitRequestFullscreen) { element.webkitRequestFullscreen(); } 
             else if (element.msRequestFullscreen) { element.msRequestFullscreen(); }
        }


        // --- PENGENDALIAN STARTUP & INPUT ---
        document.addEventListener('DOMContentLoaded', () => {
            // ... (Kekalkan logic token, intro message dan fullscreen) ...
            const token = localStorage.getItem('game_session_token_janelvy');
            if (token !== 'token_valid') {
                window.location.href = 'index.html'; 
                return;
            }
            localStorage.removeItem('game_session_token_janelvy');

            gameContainerEl.style.display = 'block';
            introMessageEl.style.display = 'flex';
            goFullscreen(document.documentElement); 

            document.getElementById('next-intro-btn').onclick = () => {
                introMessageEl.style.opacity = 0; 
                playAlarmSound(); 
                
                setTimeout(() => {
                    introMessageEl.style.display = 'none';
                    updateScene('alarm_start');
                }, 3000); 
            };
            
            // Input Keyboard
            document.addEventListener('keydown', (event) => {
                const key = event.key.toLowerCase();
                if (['w', 'a', 's', 'd', 'arrowup', 'arrowleft', 'arrowdown', 'arrowright'].includes(key)) {
                    handleMovement(key);
                    event.preventDefault(); 
                }
            });
            document.addEventListener('keyup', (event) => {
                const key = event.key.toLowerCase();
                if (['a', 'd', 'arrowleft', 'arrowright'].includes(key)) {
                    const isFlippedOnStop = (key === 'a' || key === 'arrowleft');
                    stopWalkAnimation(isFlippedOnStop); 
                }
            });
        });

        let charPositionX = 45; 
const MOVE_SPEED = 2; 
const INTERACTION_RANGE = 45; // Ditingkatkan daripada 25 kepada 45 untuk jarak interaksi lebih mudah!
// ...

// FUNGSI CHECK INTERACTION (Diperbaiki)
function checkInteraction() {
    const activeObjects = document.querySelectorAll('.interactive-object[style*="block"]');
    if (activeObjects.length === 0) return;
    let interacted = false;
    const currentTime = Date.now();
    
    // Semak setiap objek yang aktif
    activeObjects.forEach(obj => {
        // Objek interaktif dalam map pixel biasanya menggunakan posisi LEFT: XX%
        const targetPosLeft = parseInt(obj.style.left); 
        
        // Semak jika jarak karakter (charPositionX) dan objek (targetPosLeft) berada dalam julat
        if (Math.abs(charPositionX - targetPosLeft) < INTERACTION_RANGE) {
            
            // Semak cooldown (untuk mengelakkan double click)
            if (currentTime - lastInteractionTime > COOLDOWN) { 
                
                // --- PENTING: Mencetuskan Logik Objek ---
                obj.click(); 
                
                const isFlippedOnStop = characterEl.style.transform.includes('-1');
                stopWalkAnimation(isFlippedOnStop); 
                interacted = true; 
                lastInteractionTime = currentTime; 
            }
            return; 
        }
    });

    if (!interacted && (currentTime - lastInteractionTime > COOLDOWN)) {
        // Jika tidak berinteraksi dalam julat, tunjukkan mesej
        document.getElementById('char-dialogue').textContent = "Saya perlu pergi lebih dekat untuk berinteraksi dengan itu.";
        lastInteractionTime = currentTime;
    }
}

// ... (Kekalkan fungsi lain) ...

// FUNGSI UPDATE INTERACTIVE OBJECTS (Pastikan logic berturutan betul)
function updateInteractiveObjects(activeObjects) {
    // ... (Kekalkan logic sembunyi semua objek) ...

    activeObjects.forEach(objId => {
        const objEl = document.getElementById(objId);
        if (objEl) {
            objEl.style.display = 'block';
            
            // Logic klik dipindah dari checkInteraction ke sini
            objEl.onclick = () => {
                let nextScene = null;
                
                // Pastikan anda cukup dekat untuk berinteraksi sebelum menjalankan logic!
                if (Math.abs(charPositionX - parseInt(objEl.style.left)) > INTERACTION_RANGE) {
                     document.getElementById('char-dialogue').textContent = "Saya perlu pergi lebih dekat untuk berinteraksi dengan itu.";
                     return; 
                }
                
                if (objId === 'alarm-clock') {
                    stopAlarmSound(); 
                    nextScene = 'alarm_off';
                }
                // ... (Kekalkan logic interaksi scene yang lain) ...
                else if (objId === 'calendar') nextScene = 'calendar_check';
                else if (objId === 'door-exit') {
                     nextScene = currentSceneKey === 'alarm_off' || currentSceneKey === 'return_to_room_sad' ? 'head_to_living_room' : 'ask_permission';
                }
                else if (objId === 'mother') {
                    if (currentSceneKey === 'head_to_living_room') nextScene = 'talk_to_mother';
                    else if (currentSceneKey === 'ask_permission') nextScene = 'cat_missing';
                }
                else if (objId === 'door-exit-living') {
                     nextScene = currentSceneKey === 'mother_reply_sad' ? 'return_to_room_sad' : 'quest_1_start';
                }
                
                if (nextScene) updateScene(nextScene);
            };
        }
    });
}
    </script>

</body>
</html>
