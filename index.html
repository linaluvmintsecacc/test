<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janelvy's Sweet16 Adventure - Main Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Caveat', cursive;
            background: linear-gradient(to bottom, #fff0f5, #ffe6f0);
            height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            color: #d1005c; text-align: center;
        }
        .menu {
            padding: 30px 50px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.7);
        }
        .menu h1 { font-size: 48px; margin-bottom: 20px; text-shadow: 0 0 5px #ffb6c1; }
        .character { width: 160px; margin-bottom: 30px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        button {
            padding: 12px 30px; font-size: 20px; border: none; border-radius: 12px;
            background-color: #ff69b4; color: white; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s; margin: 10px auto; display: block;
        }
        button:hover { transform: scale(1.1); box-shadow: 0 0 15px #ffb6c1; }
        #credits-page { display: none; }
    </style>
</head>
<body>

    <div id="menu" class="menu">
        <h1>Sweet16 Adventure</h1>
        <img src="assets/pipi.png" alt="Pink floating character" class="character" onerror="this.src='placeholder.png';">
        <button id="newGameBtn">New Game</button>
        <button id="creditsBtn">Credits</button>
    </div>

    <div id="credits-page">
        <button onclick="goBack()">⬅ Back to Menu</button>
    </div>

    <script>
        function goBack() {
            document.getElementById('credits-page').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
        }
        document.getElementById('creditsBtn').onclick = () => {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('credits-page').style.display = 'block';
        };

        // --- PENTING: LOGIK TOKEN SESI ---
        document.getElementById('newGameBtn').onclick = () => {
            // Set token sesi dalam localStorage. Boleh guna nama unik.
            localStorage.setItem('game_session_token_janelvy', 'token_valid');
            // Alihkan pemain ke halaman permainan
            window.location.href = 'game.html'; 
        };
    </script>

</body>
</html>
